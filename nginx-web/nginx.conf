worker_processes 1;
events {
    worker_connections 1024;
}
http {
    log_format json_combined escape=json
    '{'
      '"ts":"$time_iso8601",'
      '"ip":"$remote_addr",'
      '"method":"$request_method",'
      '"path":"$uri",'
      '"status":$status,'
      '"bytes":$body_bytes_sent,'
      '"rt":$request_time'
    '}';
    
    access_log syslog:server=fluent-bit:514,facility=local7,tag=nginx,severity=info json_combined;
    
    server {
        listen 80;
        
        location /product1 {
            return 200 "Product 1 - Premium Widget\n";
            add_header Content-Type text/plain;
        }
        
        location /product2 {
            return 200 "Product 2 - Standard Widget\n";
            add_header Content-Type text/plain;
        }
        
        location /product3 {
            return 200 "Product 3 - Budget Widget\n";
            add_header Content-Type text/plain;
        }
        
        location /product4 {
            return 200 "Product 4 - Premium Gadget\n";
            add_header Content-Type text/plain;
        }
        
        location /product5 {
            return 200 "Product 5 - Specialty Item\n";
            add_header Content-Type text/plain;
        }
        
        location / {
            return 404 "Not Found\n";
        }
    }
}